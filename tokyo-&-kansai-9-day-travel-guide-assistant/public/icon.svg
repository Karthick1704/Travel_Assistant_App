<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
    <linearGradient id="fujiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Crimson Rising Sun -->
  <circle cx="256" cy="230" r="130" fill="url(#sunGrad)" opacity="0.95" />

  <!-- Mount Fuji Base -->
  <path d="M 60 440 L 210 260 L 302 260 L 452 440 Z" fill="url(#fujiGrad)" />

  <!-- Mount Fuji Snow Cap -->
  <path d="M 210 260 L 256 200 L 302 260 L 285 285 L 270 270 L 256 295 L 242 270 L 227 285 Z" fill="url(#snowGrad)" />

  <!-- Ascending Airplane Trail & Plane -->
  <path d="M 90 320 Q 210 210 370 140" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 8" opacity="0.8" />
  
  <!-- Sleek Airplane (cx 375, cy 138, angled) -->
  <g transform="translate(380, 136) rotate(-28) scale(0.9)">
    <path d="M 0 -24 L 6 -10 L 32 -2 L 32 4 L 7 1 L 6 16 L 15 22 L 15 26 L 0 23 L -15 26 L -15 22 L -6 16 L -7 1 L -32 4 L -32 -2 L -6 -10 Z" fill="#ffffff" />
    <circle cx="0" cy="-6" r="3" fill="#0284c7" />
  </g>

  <!-- Elegant Gold Label Ribbon -->
  <text x="256" y="475" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="3">JAPAN GUIDE</text>
</svg>
